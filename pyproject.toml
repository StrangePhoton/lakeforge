[project]
name = "lakeforge"
version = "0.5.0"
description = "Open-source reference architecture for an industrial fleet lakehouse."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "pyspark==4.2.0",
    "delta-spark==4.4.1",
]

[project.scripts]
lakeforge = "lakeforge.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.3",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lakeforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]
markers = [
    "integration: tests that require a running PostgreSQL source database",
    "spark: tests that start a local Spark session",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["lakeforge"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["lakeforge"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["delta", "delta.*"]
ignore_missing_imports = true

[tool.uv]
package = true
default-groups = ["dev"]
