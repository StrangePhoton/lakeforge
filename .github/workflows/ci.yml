name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: lakeforge
          POSTGRES_PASSWORD: lakeforge
          POSTGRES_DB: lakeforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lakeforge -d lakeforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      kafka:
        image: apache/kafka:4.4.0
        ports:
          - 19092:19092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:19092,PLAINTEXT://kafka:9092
          KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:19092,PLAINTEXT://:9092
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
          CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
          KAFKA_NUM_PARTITIONS: 1
          KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
        options: >-
          --hostname kafka
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12
          --health-start-period 20s
    env:
      LAKEFORGE_POSTGRES_HOST: localhost
      LAKEFORGE_POSTGRES_PORT: "5432"
      LAKEFORGE_POSTGRES_DB: lakeforge
      LAKEFORGE_POSTGRES_USER: lakeforge
      LAKEFORGE_POSTGRES_PASSWORD: lakeforge
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install the locked environment
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Set up Temurin 17
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Test
        run: uv run pytest
